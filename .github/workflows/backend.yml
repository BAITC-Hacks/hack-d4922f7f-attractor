name: Backend
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock ".[test]"
      - run: python -m unittest discover -s tests -t .
      - run: python -m ruff check engine data_gate services ai tests scripts
      - run: python -m scripts.export_openapi --check
      - run: python -m build --wheel
      - run: python scripts/smoke_wheel.py dist/akim_simulation_engine-0.3.0-py3-none-any.whl
  compose:
    runs-on: ubuntu-latest
    env:
      AKIM_LLM_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: docker compose exec -T api python -m scripts.demo_backend
      - run: docker compose exec -T api python -m scripts.demo_backend --url http://web/api
      - run: docker compose exec -T api python -m scripts.demo_v2
      - run: curl --fail http://localhost:8080/
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
